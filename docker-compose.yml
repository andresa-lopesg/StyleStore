services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    ports:
      - "5067:5067"
    environment:
      - ASPNETCORE_URLS=http://+:5067
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=loja;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True
    volumes:
      - images_data:/app/wwwroot/images
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sqlserver_data:
  images_data:
